# ReportSearch.exe UI automation test configuration
# NOTE: values are stored as plain UTF-8 (Cyrillic readable).
# The driver normalizes them via UnicodeEscapes.decode() in ReportSearchDriver constructor,
# so if a value still arrives as "\uXXXX" escapes (e.g. read with ISO-8859-1)
# they are decoded there.  Keep this file UTF-8 (no BOM).

spring.main.web-application-type=none

# Application under test
app.exe.path=D:\\workspace_delphi\\project_01\\ReportSearch.exe
app.exe.workdir=D:\\workspace_delphi\\project_01
app.reports.dir=D:\\workspace_delphi\\project_01\\reports

# Main form window title
app.main.title=Поиск по отчётным формам

# Search needle (the app searches file CONTENT, not filenames).
# This string appears uniquely in otchet_kassa_may_2026.xml.
app.search.needle=Отчет по кассе за май 2026

# Expected report file name
app.report.expected.file=otchet_kassa_may_2026.xml

# Viewer window title prefix (after opening the report)
app.viewer.title.prefix=Просмотр

# Button captions
app.button.search=Поиск
app.button.open=Открыть XML
app.button.close=Закрыть

# Automation timing (milliseconds)
app.wait.step.ms=400
app.wait.search.ms=1500
app.wait.after.click.ms=1000
app.launch.wait.ms=2000

# ReportSearch dialog (opened via File -> Open) and its OK button
app.reportsearch.dialog.title=ReportSearch
app.menu.open.command.id=2

# Folder that receives the per-step screenshots
app.screenshot.dir=D:\\workspace_delphi\\at_project_01_java\\screenshots